services:
  n8n:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: n8n_auto_uploader
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./downloads:/home/node/downloads

volumes:
  n8n_data:
